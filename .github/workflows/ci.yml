name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze project source
        run: flutter analyze lib
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  build-android:
    name: Build Android APK (Dev)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (dev flavor, debug)
        run: flutter build apk --flavor dev --debug --dart-define=API_PROVIDER=directus

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iderkopi-absensi-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14
