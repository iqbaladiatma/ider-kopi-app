name: iderkopi_absensi
description: Aplikasi absensi IderKopi dengan GPS dan foto selfie
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.0.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  camera: ^0.10.5
  image: ^4.1.0
  path_provider: ^2.1.0
  google_maps_flutter: ^2.5.0
  intl: ^0.18.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
