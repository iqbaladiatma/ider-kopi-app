name: iderkopi_absensi
description: Aplikasi absensi IderKopi dengan GPS dan foto selfie
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.0.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  camera: ^0.10.5
  image: ^4.1.0
  path_provider: ^2.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.18.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  # v1.2 — Offline Mode
  sqflite: ^2.3.0
  path: ^1.8.3
  workmanager: ^0.10.7
  connectivity_plus: ^5.0.2
  # v1.3 — Notifications & Reminders
  flutter_local_notifications: ^22.2.0
  timezone: 0.11.1
  flutter_timezone: ^5.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0
  integration_test:
    sdk: flutter
  # v1.2 — Testing SQLite in-memory
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF4B4B"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/splash_logo.png
  android_12:
    image: assets/icons/splash_logo.png
    color: "#FFFFFF"
  android: true
  ios: true
